<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>To-Knowledge Mission Control · Sign in</title>
<meta name="viewport" content="width=1200"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css?v=6"/>
<style>
  html, body { background: #070912; min-height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    color: var(--fg-0);
    font-family: var(--font-sans);
  }
  .auth-shell {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 48px;
    width: min(1100px, 100%);
    min-height: 640px;
    background: linear-gradient(160deg, #0b1020 0%, #0a0d1c 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .auth-hero {
    position: relative;
    padding: 32px;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.04);
    background: radial-gradient(ellipse at 20% 20%, rgba(107,179,255,0.12), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(161,107,255,0.1), transparent 50%);
    overflow: hidden;
  }
  .auth-brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; font-weight: 500;
    letter-spacing: -0.01em;
  }
  .auth-brand-mark {
    width: 28px; height: 28px; border-radius: 50%;
    background: conic-gradient(from 0deg, #5b8cff, #a16bff, #ff4f8a, #ffcc3a, #3ddc84, #5b8cff);
    box-shadow: 0 0 18px rgba(139,124,255,0.6);
  }
  .auth-hero-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .auth-hero-title {
    font-size: 32px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .auth-hero-sub {
    color: var(--fg-2); font-size: 14px; margin-top: 10px; line-height: 1.5;
    max-width: 380px;
  }
  .auth-stats {
    display: flex; gap: 20px; margin-top: 28px;
  }
  .auth-stat {
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
  }
  .auth-stat-value {
    font-size: 18px; font-weight: 600; color: var(--fg-0);
    font-family: var(--font-mono);
  }
  .auth-stat-label { font-size: 11px; color: var(--fg-2); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }
  .auth-footer {
    font-size: 11px; color: var(--fg-3);
    display: flex; gap: 16px; align-items: center;
  }
  .auth-footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fg-3); }

  /* floating particle backdrop */
  .auth-bg-graph { position: absolute; inset: 0; z-index: 0; opacity: 0.4; pointer-events: none; }
  .auth-hero > * { position: relative; z-index: 1; }

  .auth-panel {
    padding: 48px 40px;
    display: flex; flex-direction: column;
    gap: 20px;
  }
  .auth-tabs {
    display: flex; gap: 2px;
    padding: 3px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .auth-tab {
    flex: 1; padding: 7px 10px; font-size: 12px;
    background: transparent; border: 0; color: var(--fg-2);
    cursor: pointer; border-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }
  .auth-tab.active { background: rgba(107,179,255,0.15); color: #6bb3ff; }
  .auth-heading {
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg-0);
  }
  .auth-sub { color: var(--fg-2); font-size: 12px; margin-top: 2px; }

  .auth-field { display: flex; flex-direction: column; gap: 6px; }
  .auth-field label { font-size: 11px; color: var(--fg-2); letter-spacing: 0.03em; font-weight: 500; }
  .auth-input {
    background: #0a0e1e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--fg-0); font-size: 13px;
    outline: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .auth-input:focus { border-color: #6bb3ff; background: #0c1124; }
  .auth-input[readonly] { color: var(--fg-2); cursor: not-allowed; }

  .auth-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .auth-row a { color: #6bb3ff; text-decoration: none; cursor: pointer; }
  .auth-row a:hover { text-decoration: underline; }
  .auth-check { display: flex; align-items: center; gap: 8px; color: var(--fg-1); cursor: pointer; user-select: none; }
  .auth-check input { accent-color: #6bb3ff; }

  .auth-submit {
    background: linear-gradient(180deg, #6bb3ff, #4d8eff);
    color: white; border: 0; padding: 11px 16px;
    border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
    box-shadow: 0 4px 18px rgba(77,142,255,0.4);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .auth-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(77,142,255,0.55); }
  .auth-submit:active { transform: translateY(0); }
  .auth-submit[disabled] { opacity: 0.5; cursor: not-allowed; }

  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--fg-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
  }

  .auth-sso { display: flex; flex-direction: column; gap: 8px; }
  .auth-sso button {
    background: #0a0e1e;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--fg-1);
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 12px;
    display: flex; align-items: center; gap: 10px; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .auth-sso button:hover { background: #0d1227; border-color: rgba(255,255,255,0.15); }
  .auth-sso .sso-glyph { width: 14px; height: 14px; flex-shrink: 0; }

  .auth-bottom {
    margin-top: auto;
    text-align: center; color: var(--fg-2); font-size: 12px;
  }
  .auth-bottom a { color: #6bb3ff; text-decoration: none; }

  .auth-honest {
    padding: 10px 12px;
    background: rgba(255,204,58,0.08);
    border: 1px solid rgba(255,204,58,0.2);
    border-radius: 8px;
    color: var(--warn);
    font-size: 11px;
    display: flex; gap: 8px; align-items: flex-start;
  }

  /* QR box */
  .auth-qr {
    width: 180px; height: 180px;
    background: white;
    border-radius: 10px;
    padding: 10px;
    margin: 12px auto;
    display: flex; align-items: center; justify-content: center;
  }
  .auth-qr svg { width: 100%; height: 100%; }
  .auth-code {
    display: flex; gap: 8px; justify-content: center;
  }
  .auth-code input {
    width: 40px; height: 46px; text-align: center; font-size: 18px;
    font-family: var(--font-mono); background: #0a0e1e;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 7px; color: var(--fg-0);
    outline: 0;
  }
  .auth-code input:focus { border-color: #6bb3ff; }
  .auth-secret {
    font-family: var(--font-mono); font-size: 11px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    padding: 8px 10px; border-radius: 6px;
    color: var(--fg-1); text-align: center; letter-spacing: 0.1em;
    user-select: all;
  }

  @media (max-width: 880px) {
    .auth-shell { grid-template-columns: 1fr; }
    .auth-hero { display: none; }
  }
</style>
</head>
<body>

<div class="auth-shell">
  <!-- Hero / left panel -->
  <section class="auth-hero">
    <svg class="auth-bg-graph" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="ring1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(107,179,255,0.3)"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <circle cx="180" cy="260" r="200" fill="url(#ring1)"/>
      <g stroke="rgba(107,179,255,0.2)" stroke-width="0.6" fill="none">
        <circle cx="180" cy="260" r="60"/>
        <circle cx="180" cy="260" r="110"/>
        <circle cx="180" cy="260" r="170"/>
      </g>
      <g fill="#6bb3ff" opacity="0.7">
        <circle cx="120" cy="200" r="2"/>
        <circle cx="240" cy="210" r="1.5"/>
        <circle cx="200" cy="310" r="2.5"/>
        <circle cx="100" cy="280" r="1.5"/>
        <circle cx="260" cy="330" r="2"/>
      </g>
      <g fill="#a16bff" opacity="0.7">
        <circle cx="340" cy="180" r="2"/>
        <circle cx="420" cy="240" r="1.5"/>
        <circle cx="380" cy="300" r="2"/>
      </g>
      <g fill="#ff4f8a" opacity="0.7">
        <circle cx="160" cy="420" r="2"/>
        <circle cx="220" cy="460" r="1.5"/>
      </g>
    </svg>

    <div class="auth-brand">
      <div class="auth-brand-mark"></div>
      <span>To-Knowledge <span style="color:var(--fg-2); font-weight:400">Mission Control</span></span>
    </div>

    <div class="auth-hero-body">
      <h1 class="auth-hero-title">Your agents, memories, and systems — one living interface.</h1>
      <p class="auth-hero-sub">Sign in to oversee agent operations, sync your second brain, and run the Mission Control command center.</p>
      <div class="auth-stats">
        <div class="auth-stat">
          <div class="auth-stat-value">1.24M</div>
          <div class="auth-stat-label">Nodes</div>
        </div>
        <div class="auth-stat">
          <div class="auth-stat-value">8.74M</div>
          <div class="auth-stat-label">Edges</div>
        </div>
        <div class="auth-stat">
          <div class="auth-stat-value">98%</div>
          <div class="auth-stat-label">Sync health</div>
        </div>
      </div>
    </div>

    <div class="auth-footer">
      <span>© 2025 To-Knowledge</span>
      <span class="dot"></span>
      <a href="#" style="color:var(--fg-3); text-decoration:none">Status</a>
      <span class="dot"></span>
      <a href="#" style="color:var(--fg-3); text-decoration:none">Security</a>
      <span class="dot"></span>
      <a href="#" style="color:var(--fg-3); text-decoration:none">Docs</a>
    </div>
  </section>

  <!-- Right panel: dynamic -->
  <section class="auth-panel" id="panel">
    <!-- Rendered by JS -->
  </section>
</div>

<script>
  // ============================================================
  // Auth flow — UI only. No backend. Every non-functional control is
  // honestly labeled. Submit simulates the flow and advances steps.
  // ============================================================
  const MODE_LOGIN   = 'login';
  const MODE_SIGNUP  = 'signup';
  const MODE_FORGOT  = 'forgot';
  const MODE_TOTP    = 'totp';       // during setup
  const MODE_VERIFY  = 'verify';     // 6-digit code

  let state = { mode: MODE_LOGIN };

  const $ = (sel, root=document) => root.querySelector(sel);

  function tabsHtml(active) {
    const tabs = [['login','Log in'], ['signup','Sign up']];
    return '<div class="auth-tabs">' + tabs.map(([id,l]) =>
      `<button class="auth-tab ${active===id?'active':''}" data-mode="${id}">${l}</button>`
    ).join('') + '</div>';
  }

  function render() {
    const p = $('#panel');
    if (state.mode === MODE_LOGIN) {
      p.innerHTML = `
        ${tabsHtml('login')}
        <div>
          <div class="auth-heading">Welcome back</div>
          <div class="auth-sub">Sign in to To-Knowledge Mission Control.</div>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input class="auth-input" id="in-email" type="email" placeholder="you@to-knowledge.com" autocomplete="email"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input class="auth-input" id="in-pwd" type="password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <div class="auth-row">
          <label class="auth-check"><input type="checkbox" id="in-remember" checked/>Remember me for 30 days</label>
          <a data-goto="${MODE_FORGOT}">Forgot password?</a>
        </div>
        <button class="auth-submit" id="btn-login">Sign in</button>

        <div class="auth-divider">or continue with</div>
        <div class="auth-sso">
          <button id="sso-google"><span class="sso-glyph">${ssoGlyph('google')}</span>Continue with Google Workspace</button>
          <button id="sso-ms"><span class="sso-glyph">${ssoGlyph('ms')}</span>Continue with Microsoft 365</button>
        </div>

        <div class="auth-honest">
          <span style="font-weight:600">Prototype notice</span>
          <span>Auth is UI only. No backend is wired — credentials are not transmitted. Clicking Sign in advances to the 2FA screen for demo purposes.</span>
        </div>

        <div class="auth-bottom">New to Mission Control? <a data-goto="${MODE_SIGNUP}">Request an invite</a></div>
      `;
      $('#btn-login').onclick = () => { state.mode = MODE_VERIFY; render(); };
      wireTabs();
      wireGoTos();
      wireSSO();
    }
    else if (state.mode === MODE_SIGNUP) {
      p.innerHTML = `
        ${tabsHtml('signup')}
        <div>
          <div class="auth-heading">Request access</div>
          <div class="auth-sub">Mission Control is invite-only. We'll notify the admin to review.</div>
        </div>
        <div class="auth-field">
          <label>Full name</label>
          <input class="auth-input" id="su-name" type="text" placeholder="Jane Doe"/>
        </div>
        <div class="auth-field">
          <label>Work email</label>
          <input class="auth-input" id="su-email" type="email" placeholder="jane@company.com"/>
        </div>
        <div class="auth-field">
          <label>Invite code <span style="color:var(--fg-3)">(from admin)</span></label>
          <input class="auth-input" id="su-code" type="text" placeholder="TK-INVITE-••••••"/>
        </div>
        <div class="auth-field">
          <label>Choose password</label>
          <input class="auth-input" id="su-pwd" type="password" placeholder="At least 12 characters"/>
        </div>
        <label class="auth-check" style="font-size:12px"><input type="checkbox" id="su-terms"/>I agree to the <a href="#">terms</a> and <a href="#">privacy policy</a></label>
        <button class="auth-submit" id="btn-signup">Request access</button>

        <div class="auth-honest">
          <span style="font-weight:600">Invite-only</span>
          <span>Sign-ups require admin approval. Without a valid invite code, requests are queued for the admin inbox.</span>
        </div>

        <div class="auth-bottom">Already have an account? <a data-goto="${MODE_LOGIN}">Sign in</a></div>
      `;
      $('#btn-signup').onclick = () => {
        alert('Request submitted · admin will review and issue a credential. (Prototype · no backend.)');
        state.mode = MODE_LOGIN; render();
      };
      wireTabs();
      wireGoTos();
    }
    else if (state.mode === MODE_FORGOT) {
      p.innerHTML = `
        <div>
          <div class="auth-heading">Reset your password</div>
          <div class="auth-sub">We'll email you a secure link to set a new password.</div>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input class="auth-input" id="fp-email" type="email" placeholder="you@to-knowledge.com"/>
        </div>
        <button class="auth-submit" id="btn-forgot">Send reset link</button>

        <div class="auth-honest">
          <span style="font-weight:600">SMTP not yet wired</span>
          <span>Password reset emails require an SMTP profile configured in Settings → Messaging. Until then, resets must be issued by an admin.</span>
        </div>

        <div class="auth-bottom"><a data-goto="${MODE_LOGIN}">← Back to sign in</a></div>
      `;
      $('#btn-forgot').onclick = () => {
        alert('If this email is on file, a reset link will be sent. (Prototype · SMTP not wired.)');
        state.mode = MODE_LOGIN; render();
      };
      wireGoTos();
    }
    else if (state.mode === MODE_VERIFY) {
      p.innerHTML = `
        <div>
          <div class="auth-heading">Two-factor authentication</div>
          <div class="auth-sub">Enter the 6-digit code from your authenticator app.</div>
        </div>
        <div class="auth-code" id="code-row">
          ${[0,1,2,3,4,5].map(i => `<input maxlength="1" data-i="${i}" inputmode="numeric" pattern="[0-9]"/>`).join('')}
        </div>
        <div class="auth-row" style="justify-content:center; gap:16px">
          <a data-goto="${MODE_TOTP}">First time? Set up authenticator</a>
          <a data-goto="${MODE_LOGIN}">Cancel</a>
        </div>
        <button class="auth-submit" id="btn-verify" disabled>Verify and continue</button>

        <div class="auth-honest">
          <span style="font-weight:600">Code not validated</span>
          <span>Any 6 digits will pass in this prototype. Real TOTP validation runs once the auth backend is wired.</span>
        </div>

        <div class="auth-bottom">Lost your device? <a href="#" onclick="alert('Contact admin · recovery flow requires SMTP or Twilio.')">Use a recovery code</a></div>
      `;
      const inputs = [...document.querySelectorAll('#code-row input')];
      inputs.forEach((el, i) => {
        el.oninput = () => {
          el.value = el.value.replace(/\D/g,'').slice(0,1);
          if (el.value && i < 5) inputs[i+1].focus();
          const filled = inputs.every(x => x.value);
          $('#btn-verify').disabled = !filled;
        };
        el.onkeydown = (e) => {
          if (e.key === 'Backspace' && !el.value && i > 0) inputs[i-1].focus();
        };
      });
      inputs[0].focus();
      $('#btn-verify').onclick = () => {
        window.location.href = 'Mission Control.html';
      };
      wireGoTos();
    }
    else if (state.mode === MODE_TOTP) {
      p.innerHTML = `
        <div>
          <div class="auth-heading">Set up authenticator</div>
          <div class="auth-sub">Scan with Google Authenticator, 1Password, or any TOTP app.</div>
        </div>
        <div class="auth-qr">${qrSvg()}</div>
        <div class="auth-secret">JBSWY3DPEHPK3PXP · TK MC</div>
        <div class="muted xsmall" style="text-align:center">Can't scan? Enter the key manually in your authenticator.</div>

        <div class="auth-field" style="margin-top:8px">
          <label>Enter 6-digit code from your app to confirm</label>
          <div class="auth-code" id="totp-row">
            ${[0,1,2,3,4,5].map(i => `<input maxlength="1" data-i="${i}" inputmode="numeric" pattern="[0-9]"/>`).join('')}
          </div>
        </div>
        <button class="auth-submit" id="btn-totp-confirm" disabled>Confirm and continue</button>

        <div class="auth-honest">
          <span style="font-weight:600">Optional: add SMS later</span>
          <span>Phone-number SMS backup can be configured in Settings → Security once Twilio credentials are added by an admin.</span>
        </div>

        <div class="auth-bottom"><a data-goto="${MODE_VERIFY}">← Already set up? Enter code</a></div>
      `;
      const inputs = [...document.querySelectorAll('#totp-row input')];
      inputs.forEach((el, i) => {
        el.oninput = () => {
          el.value = el.value.replace(/\D/g,'').slice(0,1);
          if (el.value && i < 5) inputs[i+1].focus();
          $('#btn-totp-confirm').disabled = !inputs.every(x => x.value);
        };
      });
      $('#btn-totp-confirm').onclick = () => {
        window.location.href = 'Mission Control.html';
      };
      wireGoTos();
    }
  }

  function wireTabs(){
    document.querySelectorAll('[data-mode]').forEach(el => {
      el.onclick = () => { state.mode = el.dataset.mode; render(); };
    });
  }
  function wireGoTos(){
    document.querySelectorAll('[data-goto]').forEach(el => {
      el.onclick = (e) => { e.preventDefault(); state.mode = el.dataset.goto; render(); };
    });
  }
  function wireSSO(){
    document.querySelectorAll('.auth-sso button').forEach(b => {
      b.onclick = () => alert('SSO is not wired in this prototype. The admin must configure the identity provider in Settings → Security.');
    });
  }

  function ssoGlyph(kind){
    if (kind === 'google') return `<svg viewBox="0 0 24 24" width="14" height="14"><path fill="#4285F4" d="M23 12.2c0-.8-.1-1.5-.2-2.2H12v4.3h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7C21.8 18.6 23 15.7 23 12.2z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.6 13.8a6.6 6.6 0 0 1 0-4.2V6.9H1.8a11 11 0 0 0 0 10.2z"/><path fill="#EA4335" d="M12 5.4c1.7 0 3.2.6 4.3 1.7l3.3-3.3A11 11 0 0 0 1.8 6.9l3.8 2.9C6.5 7.1 9 5.4 12 5.4z"/></svg>`;
    if (kind === 'ms')     return `<svg viewBox="0 0 24 24" width="14" height="14"><rect x="2" y="2" width="9.5" height="9.5" fill="#F35325"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#81BC06"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#05A6F0"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#FFBA08"/></svg>`;
    return `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
  }

  function qrSvg(){
    // Synthetic QR — deterministic pattern, looks like a real QR at a glance
    const cells = 21;
    let out = `<svg viewBox="0 0 ${cells} ${cells}" shape-rendering="crispEdges">`;
    const grid = [];
    const rand = (s) => { const x = Math.sin(s*137.5) * 43758.5; return x - Math.floor(x); };
    // finder squares
    function drawFinder(x,y){
      out += `<rect x="${x}" y="${y}" width="7" height="7" fill="black"/>`;
      out += `<rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/>`;
      out += `<rect x="${x+2}" y="${y+2}" width="3" height="3" fill="black"/>`;
    }
    drawFinder(0,0); drawFinder(14,0); drawFinder(0,14);
    for (let y=0;y<cells;y++){
      for (let x=0;x<cells;x++){
        if ((x<8&&y<8) || (x>12&&y<8) || (x<8&&y>12)) continue;
        if (rand(y*cells+x) > 0.55) out += `<rect x="${x}" y="${y}" width="1" height="1" fill="black"/>`;
      }
    }
    out += '</svg>';
    return out;
  }

  render();
</script>

</body>
</html>
